robot_base_frame: base_link
transform_tolerance: 0.5
# Actual chassis is 0.72 m x 0.50 m; padding adds clearance per side.
footprint: [[-0.36, -0.25], [-0.36, 0.25], [0.36, 0.25], [0.36, -0.25]]
footprint_padding: 0.03
resolution: 0.05
obstacle_layer:
  enabled: true
  observation_sources: laser
  laser:
    data_type: LaserScan
    topic: /helios/scan_filtered
    marking: true
    clearing: true
    obstacle_range: 8.0
    raytrace_range: 10.0
    inf_is_valid: true
    min_obstacle_height: -1.0
    max_obstacle_height: 2.0
    observation_persistence: 0.0
inflation_layer:
  enabled: true
  inflation_radius: 0.1
  cost_scaling_factor: 3.0
