odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2
laser_model_type: likelihood_field
laser_max_beams: 60
laser_min_range: 0.5
laser_max_range: 15.0
laser_likelihood_max_dist: 2.0
laser_z_hit: 0.95
laser_z_rand: 0.05
laser_sigma_hit: 0.2
update_min_d: 0.1
update_min_a: 0.1
resample_interval: 1
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
gui_publish_rate: 5.0
